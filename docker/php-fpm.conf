[global]
error_log = /proc/self/fd/2
daemonize = no

[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

; static: jumlah worker tetap agar perilaku sama di setiap replika (variabel kontrol)
pm = static
pm.max_children = 6
pm.max_requests = 1000

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 30s
