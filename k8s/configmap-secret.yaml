# Konfigurasi Laravel untuk SIMTAG. Terapkan: kubectl apply -f k8s/configmap-secret.yaml
# Nilai diambil dari .env lokal (APP_KEY, DB user/password). Jangan commit repo publik.
apiVersion: v1
kind: ConfigMap
metadata:
  name: simtag-config
  labels:
    app: simtag
data:
  APP_NAME: "SIMTAG"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://localhost:30080"
  APP_LOCALE: "id"
  APP_FALLBACK_LOCALE: "id"

  # Log ke stderr agar tidak menulis file di filesystem pod.
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "warning"

  # Shared MySQL eksternal, DI LUAR worker node yang jadi target gangguan.
  # Pada Kind + Docker Desktop, host laptop = host.docker.internal.
  # Pastikan MySQL host: bind-address tidak hanya 127.0.0.1, dan user
  # diizinkan dari subnet node Kind, contoh:
  #   CREATE USER 'simtag'@'172.18.%' IDENTIFIED BY '...';
  #   GRANT ALL ON simtag_db.* TO 'simtag'@'172.18.%';
  DB_CONNECTION: "mysql"
  DB_HOST: "host.docker.internal"
  DB_PORT: "3306"
  DB_DATABASE: "simtag_db"

  # Wajib stateless (CLAUDE.md aturan 2).
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "sync"
  FILESYSTEM_DISK: "local"
  BROADCAST_CONNECTION: "log"
  MAIL_MAILER: "log"
---
apiVersion: v1
kind: Secret
metadata:
  name: simtag-secret
  labels:
    app: simtag
type: Opaque
stringData:
  # Diambil dari .env lokal (php artisan key:generate --show).
  # Jika commit repo publik, ganti nilai rahasia asli.
  APP_KEY: "base64:HJrf5Z84mjw6/eEZPGtYdPAy9GepKa/eFbongURoh+g="
  # User MySQL di host laptop (sesuai .env lokal: root tanpa password).
  # User root dari subnet kontainer hanya berlaku bila MySQL diizinkan
  # menerima koneksi eksternal; buat user khusus jika perlu (lihat komentar
  # DB_HOST di ConfigMap di atas).
  DB_USERNAME: "root"
  DB_PASSWORD: ""
  # Header rahasia untuk POST /test/crash (jika endpoint itu dibuat).
  TEST_KEY: "kunci-uji-simtag"
