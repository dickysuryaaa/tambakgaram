# Konfigurasi Laravel untuk SIMTAG. Terapkan: kubectl apply -f k8s/configmap-secret.yaml
# Ganti semua nilai bertanda GANTI sebelum dipakai. Jangan commit nilai rahasia asli.
apiVersion: v1
kind: ConfigMap
metadata:
  name: simtag-config
  labels:
    app: simtag
data:
  APP_NAME: "SIMTAG"
  APP_ENV: "production"
  APP_DEBUG: "false"
  APP_URL: "http://GANTI-IP-NODE:30080"
  APP_LOCALE: "id"
  APP_FALLBACK_LOCALE: "id"

  # Log ke stderr agar tidak menulis file di filesystem pod.
  LOG_CHANNEL: "stderr"
  LOG_LEVEL: "warning"

  # Shared MySQL di luar worker node target gangguan.
  DB_CONNECTION: "mysql"
  DB_HOST: "GANTI-HOST-MYSQL"
  DB_PORT: "3306"
  DB_DATABASE: "simtag_db"

  # Wajib stateless (CLAUDE.md aturan 2).
  SESSION_DRIVER: "database"
  SESSION_LIFETIME: "120"
  CACHE_STORE: "database"
  QUEUE_CONNECTION: "sync"
  FILESYSTEM_DISK: "local"
  BROADCAST_CONNECTION: "log"
  MAIL_MAILER: "log"
---
apiVersion: v1
kind: Secret
metadata:
  name: simtag-secret
  labels:
    app: simtag
type: Opaque
stringData:
  # Buat dengan: php artisan key:generate --show
  APP_KEY: "base64:GANTI-DENGAN-KEY-HASIL-GENERATE"
  DB_USERNAME: "GANTI-USER-MYSQL"
  DB_PASSWORD: "GANTI-PASSWORD-MYSQL"
  # Header rahasia untuk POST /test/crash (jika endpoint itu dibuat).
  TEST_KEY: "GANTI-KUNCI-UJI"
