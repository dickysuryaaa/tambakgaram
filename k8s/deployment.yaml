# Ubah jumlah replika (1 vs 3) tanpa edit file:
#   kubectl scale deployment/simtag --replicas=3
apiVersion: apps/v1
kind: Deployment
metadata:
  name: simtag
  labels:
    app: simtag
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: simtag
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: simtag
    spec:
      # Agar pod di node NotReady dicabut lebih cepat dari default 300 detik
      # (skenario 3: worker node dihentikan).
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 10

      # Sebar merata antar worker node. Dengan 3 replika di 2 worker: 2 + 1.
      # maxSkew 1 + DoNotSchedule menjamin selisih maksimal 1 pod antar node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: simtag
      # Pelengkap: hindari menumpuk pod di node yang sama bila ada pilihan lain.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app: simtag

      terminationGracePeriodSeconds: 20
      containers:
        - name: simtag
          # Ganti dengan image hasil build/push Anda.
          image: GANTI-REGISTRY/simtag:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          envFrom:
            - configMapRef:
                name: simtag-config
            - secretRef:
                name: simtag-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          # Liveness tidak menyentuh DB: DB mati tidak boleh memicu restart container.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 3
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 2
            successThreshold: 1
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 1
            failureThreshold: 30
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
