# Cluster uji lokal: 1 control plane + 2 worker (PRD 12.1).
# NodePort 30080 dipublikasikan lewat control plane, yang tidak pernah dimatikan,
# sehingga load generator tetap bisa menembak walau salah satu worker dihentikan.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: simtag
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 30080
        protocol: TCP
  - role: worker
  - role: worker
